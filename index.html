<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學測自然・地球科學 歷屆試題（106-115 學年度）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f2ea; --paper2:#efeadd; --ink:#1f2430; --muted:#6b6f78;
    --line:#ddd6c4; --teal:#0f6b6b; --teal-soft:#e3eded; --gold:#b07d2b;
    --cat天文:#3b5a8a; --cat大氣:#2f7d8f; --cat海洋:#1f6f7a; --cat地質:#8a5a2b; --cat地史與資源:#6a4f7a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
  a{color:var(--teal);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 120px}
  header{text-align:center;margin-bottom:18px}
  h1{font-family:"Noto Serif TC",serif;font-size:30px;margin:0;letter-spacing:1px}
  .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;font-size:13px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:600}
  .src{font-size:12px;color:var(--gold)}
  /* toolbar */
  .toolbar{position:sticky;top:0;z-index:20;background:rgba(245,242,234,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:22px}
  .toolbar-inner{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .seg{display:inline-flex;background:var(--paper2);border-radius:8px;padding:3px;border:1px solid var(--line)}
  .seg button{border:0;background:transparent;font:inherit;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:600}
  .seg button.on{background:#fff;color:var(--teal);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .label{font-size:12px;color:var(--muted);margin-right:2px;font-weight:600}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:500;transition:.12s}
  .chip:hover{border-color:var(--teal);color:var(--teal)}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .chip.kp{font-size:12px;padding:3px 9px}
  .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .showall{font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-weight:600}
  .showall.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  input.search{font:inherit;padding:6px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;width:140px}
  /* groups */
  .group{margin-bottom:34px;scroll-margin-top:120px}
  .group-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:14px}
  .group-head h2{font-family:"Noto Serif TC",serif;font-size:22px;margin:0}
  .group-head .cnt{color:var(--muted);font-size:13px}
  .subgroup{margin-bottom:22px;scroll-margin-top:120px}
  .subgroup h3{font-size:15px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.5px}
  .subgroup h3 .n{color:var(--teal)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:18px 12px 100px}}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .qno{font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px}
  .tagcat{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;color:#fff}
  .kpchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .kpchip{font-size:11px;background:var(--teal-soft);color:var(--teal);border-radius:4px;padding:2px 7px;font-weight:600}
  .abchip{font-size:11px;background:#f0ece0;color:var(--gold);border-radius:4px;padding:2px 7px;font-weight:600}
  .tgchip{font-size:11px;background:var(--paper2);color:var(--muted);border-radius:4px;padding:2px 6px}
  .ansline{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);flex-wrap:wrap}
  .ansval{font-family:"Noto Serif TC",serif;font-weight:700;font-size:18px;min-width:34px;text-align:center}
  .ansval.hidden{color:transparent}
  .ansval.hidden::before{content:"點擊顯示";font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:13px;color:var(--muted);display:inline-block}
  .ansbtn{font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--paper2);border-radius:6px;padding:3px 9px;font-weight:500}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>地球科學 歷屆試題</h1>
    <div class="sub">學科能力測驗 · 自然考科</div>
    <div class="meta">
      <span><b>106–115</b> 學年度</span>
      <span><b id="qcount">0</b> 題</span>
      <span class="src">資料來源：<a href="https://github.com/arpowchao/phy-senior" target="_blank" rel="noopener">arpowchao/phy-senior</a> · <a href="https://github.com/smartgrid891-rgb/gsat-earth-science" target="_blank" rel="noopener">本站 repo</a></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="row">
        <div class="seg" id="modeseg">
          <button class="on" data-mode="year">依年份練習</button>
          <button data-mode="kp">依知識點練習</button>
        </div>
        <div class="right">
          <input class="search" id="search" placeholder="搜尋標籤/關鍵字">
          <button class="showall" id="showall">顯示全部答案</button>
        </div>
      </div>
      <div class="row" id="yearrow"></div>
      <div class="row" id="catrow" style="display:none"></div>
      <div class="row" id="abilrow"></div>
    </div>
  </div>

  <div id="content"></div>
</div>

<script>
let DATA=[], STATE={mode:'year',year:'all',cat:'all',abil:'all',search:'',showall:false};
const CATS=['天文','大氣','海洋','地質','地史與資源'];
const CATVAR=c=>('--cat'+c).replace(/與資源/,'');
const ABILS=['概念理解','圖表判讀','計算','推論分析','實驗與方法'];

fetch('es_questions.json').then(r=>r.json()).then(d=>{DATA=d;document.getElementById('qcount').textContent=d.length;build()});

function build(){
  buildChips();render();
}
function buildChips(){
  const yr=document.getElementById('yearrow');yr.innerHTML='';
  const yall=mkchip('全部','all','year');yr.appendChild(yall);
  for(let y=106;y<=115;y++)yr.appendChild(mkchip(y+' 學年度',String(y),'year'));
  const cr=document.getElementById('catrow');cr.innerHTML='';
  cr.appendChild(mkchip('全部類別','all','cat'));
  CATS.forEach(c=>cr.appendChild(mkchip(c,c,'cat','kp')));
  const ar=document.getElementById('abilrow');ar.innerHTML='<span class="label">能力</span>';
  ar.appendChild(mkchip('全部','all','abil','kp'));
  ABILS.forEach(a=>ar.appendChild(mkchip(a,a,'abil','kp')));
}
function mkchip(label,val,key,cls){
  const b=document.createElement('button');
  b.className='chip'+(cls?' '+cls:'');
  b.textContent=label;
  b.dataset.val=val;
  if(STATE[key]===val)b.classList.add('on');
  b.onclick=()=>{STATE[key]=val;buildChips();render();};
  return b;
}

function filtered(){
  return DATA.filter(q=>{
    if(STATE.mode==='year'&&STATE.year!=='all'&&String(q.year)!==STATE.year)return false;
    if(STATE.cat!=='all'&&q.category!==STATE.cat)return false;
    if(STATE.abil!=='all'&&q.ability!==STATE.abil)return false;
    if(STATE.search){
      const s=STATE.search.toLowerCase();
      const hay=(q.tags||[]).join(' ')+q.category+(q.knowledge||[]).join('')+q.ability+String(q.year);
      if(!hay.toLowerCase().includes(s))return false;
    }
    return true;
  });
}

function catColor(c){return getComputedStyle(document.documentElement).getPropertyValue(CATVAR(c)).trim();}
function render(){
  const root=document.getElementById('content');root.innerHTML='';
  const qs=filtered();
  // mode switch chips visibility
  document.getElementById('yearrow').style.display=STATE.mode==='year'?'flex':'none';
  document.getElementById('catrow').style.display=STATE.mode==='kp'?'flex':'none';
  const abilrow=document.getElementById('abilrow');
  abilrow.style.display=STATE.mode==='kp'?'flex':'none';
  if(qs.length===0){root.innerHTML='<div class="empty">沒有符合條件的題目</div>';return;}
  if(STATE.mode==='year')renderYear(root,qs);else renderKP(root,qs);
}

function cardEl(q){
  const c=document.createElement('div');c.className='card';c.dataset.k=`${q.year}_${q.q}`;
  const head=document.createElement('div');head.className='qhead';
  const no=document.createElement('span');no.className='qno';no.textContent=`${q.year}學測 第 ${q.q} 題`;head.appendChild(no);
  const tc=document.createElement('span');tc.className='tagcat';tc.style.background=catColor(q.category);tc.textContent=q.category;head.appendChild(tc);
  const ab=document.createElement('span');ab.className='abchip';ab.textContent=q.ability;head.appendChild(ab);
  c.appendChild(head);
  const kp=document.createElement('div');kp.className='kpchips';
  (q.knowledge||[]).forEach(k=>{const s=document.createElement('span');s.className='kpchip';s.textContent=k;kp.appendChild(s);});
  c.appendChild(kp);
  const img=document.createElement('img');img.loading='lazy';img.src='imgs/'+q.img;img.style.width='100%';img.style.height='auto';img.style.borderRadius='6px';
  c.appendChild(img);
  const al=document.createElement('div');al.className='ansline';
  const av=document.createElement('span');av.className='ansval'+(STATE.showall?'':' hidden');av.textContent=q.answer;
  al.appendChild(av);
  const bt=document.createElement('button');bt.className='ansbtn';bt.textContent='顯示答案';bt.onclick=()=>{av.classList.toggle('hidden');bt.textContent=av.classList.contains('hidden')?'顯示答案':'隱藏答案';};
  al.appendChild(bt);
  const tg=document.createElement('span');tg.style.cssText='font-size:11px;color:var(--muted);margin-left:auto';
  tg.textContent='#'+(q.tags||[]).slice(0,4).join(' #');
  al.appendChild(tg);
  c.appendChild(al);
  return c;
}

function renderYear(root,qs){
  const byY={};
  qs.forEach(q=>{(byY[q.year]=byY[q.year]||[]).push(q);});
  Object.keys(byY).sort((a,b)=>b-a).forEach(y=>{
    const g=document.createElement('div');g.className='group';
    const h=document.createElement('div');h.className='group-head';
    h.innerHTML=`<h2>${y} 學年度</h2><span class="cnt">${byY[y].length} 題</span>`;
    g.appendChild(h);
    const gr=document.createElement('div');gr.className='grid';
    byY[y].forEach(q=>gr.appendChild(cardEl(q)));
    g.appendChild(gr);
    root.appendChild(g);
  });
}

function renderKP(root,qs){
  const byC={};qs.forEach(q=>{(byC[q.category]=byC[q.category]||[]).push(q);});
  CATS.forEach(cat=>{
    if(!byC[cat])return;
    const g=document.createElement('div');g.className='group';
    const h=document.createElement('div');h.className='group-head';
    h.innerHTML=`<h2 style="color:${catColor(cat)}">${cat}</h2><span class="cnt">${byC[cat].length} 題</span>`;
    g.appendChild(h);
    // sub-group by knowledge point
    const byK={};
    byC[cat].forEach(q=>{q.knowledge.forEach(k=>{(byK[k]=byK[k]||[]).push(q);});});
    Object.keys(byK).sort().forEach(k=>{
      const sg=document.createElement('div');sg.className='subgroup';
      const sh=document.createElement('h3');sh.innerHTML=`${k} <span class="n">(${byK[k].length})</span>`;
      sg.appendChild(sh);
      const gr=document.createElement('div');gr.className='grid';
      // dedupe questions appearing in multiple KP
      const seen=new Set();
      byK[k].forEach(q=>{if(seen.has(q.year+'_'+q.q))return;seen.add(q.year+'_'+q.q);gr.appendChild(cardEl(q));});
      sg.appendChild(gr);
      g.appendChild(sg);
    });
    root.appendChild(g);
  });
}

// mode switch
document.getElementById('modeseg').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')return;
  STATE.mode=e.target.dataset.mode;
  document.querySelectorAll('#modeseg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===STATE.mode));
  // reset sub-filters sensibly
  if(STATE.mode==='year'){STATE.cat='all';}
  document.getElementById('search').value='';STATE.search='';
  buildChips();render();
});
document.getElementById('showall').addEventListener('click',function(){STATE.showall=!STATE.showall;this.classList.toggle('on',STATE.showall);this.textContent=STATE.showall?'隱藏全部答案':'顯示全部答案';render();});
document.getElementById('search').addEventListener('input',e=>{STATE.search=e.target.value.trim();render();});
</script>
<script data-pplx-inline-edit>
(function () {
  if (window === window.top) return;

  const allowedParentOrigins = ["https://www.perplexity.ai","https://perplexity.ai","https://testing.perplexity.ai","https://staging.perplexity.ai","https://*.preview.i.perplexity.ai","http://perplexity.localhost","http://localhost:1420","http://127.0.0.1:1420","http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"];
  const MAX_FONT_BYTES = 500 * 1024;
  const MAX_TOTAL_FONT_BYTES = 2 * 1024 * 1024;
  let scrollForwarding = false;
  let scrollRaf = 0;
  let trustedTopOrigin = null;

  // Allow entries like "https://*.preview.i.perplexity.ai" — the wildcard
  // matches a single DNS label (no dots), so "https://*.foo" cannot stretch
  // across multiple labels.
  function matchesAllowedOrigin(origin) {
    if (!origin) return false;
    for (const entry of allowedParentOrigins) {
      if (!entry.includes("*")) {
        if (entry === origin) return true;
        continue;
      }
      const pattern = new RegExp(
        "^" +
          entry.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "[^.]+") +
          "$",
      );
      if (pattern.test(origin)) return true;
    }
    return false;
  }

  // Trust decision: when the sender is same-origin-visible (event.origin is a
  // real origin like https://www.perplexity.ai) we trust event.origin directly.
  // When event.origin is "null" (opaque broker srcdoc), we fall back to the
  // broker's stamped `parentOrigin` to identify the top window. The fallback
  // is claim-only — we rely on the browser's native `targetOrigin` enforcement
  // on the response path (see postToTrustedTop) to ensure replies can't be
  // delivered to anyone but the actual top window of that claimed origin.
  function getTrustedParentOrigin(event) {
    const forwardedParentOrigin =
      typeof event.data.parentOrigin === "string" ? event.data.parentOrigin : null;
    const parentOrigin = event.origin === "null" ? forwardedParentOrigin : event.origin;
    return matchesAllowedOrigin(parentOrigin) ? parentOrigin : null;
  }

  // All responses go to window.top with targetOrigin = the allowlisted origin.
  // An attacker that iframes us inside their own null-origin broker can claim
  // any parentOrigin they like, but the browser will drop the reply whenever
  // the real top's origin doesn't match — so the screenshot never leaves.
  function postToTrustedTop(message) {
    if (!trustedTopOrigin) return;
    try {
      window.top.postMessage(message, trustedTopOrigin);
    } catch (_error) {}
  }

  function inlineAll(original, clone) {
    if (original.nodeType !== 1 || clone.nodeType !== 1) return;

    try {
      const computedStyle = getComputedStyle(original);
      // cssText on a computed style is the serialized declaration in modern
      // Chromium/Safari — a single read beats enumerating ~400 longhand
      // properties. Firefox returns "" here, so we fall back on empty.
      const serialized = computedStyle.cssText;
      if (serialized) {
        clone.style.cssText = serialized;
      } else {
        const parts = new Array(computedStyle.length);
        for (let index = 0; index < computedStyle.length; index += 1) {
          const property = computedStyle[index];
          parts[index] = `${property}:${computedStyle.getPropertyValue(property)};`;
        }
        clone.style.cssText = parts.join("");
      }
    } catch (_error) {}

    const originalChildren = original.children;
    const clonedChildren = clone.children;
    for (
      let index = 0;
      index < originalChildren.length && index < clonedChildren.length;
      index += 1
    ) {
      inlineAll(originalChildren[index], clonedChildren[index]);
    }
  }

  function extractFontUrl(srcValue) {
    const matches = [
      ...srcValue.matchAll(
        /url\(["']?([^"')]+)["']?\)(?:\s*format\(["']?([^"')]+)["']?\))?/gi,
      ),
    ];
    if (matches.length === 0) return null;
    const woff2 = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff2"));
    if (woff2) return woff2[1];
    const woff = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff"));
    if (woff) return woff[1];
    return matches[0][1];
  }

  // Cache resolved font URL -> data URI across captures. Fonts on a page
  // essentially never change, and a batch run emits multiple captures back to
  // back — without this we'd refetch + re-base64 every time.
  const fontDataUriCache = new Map();
  const SRC_DECLARATION_RE = /src\s*:\s*[^;}]+/i;

  async function fetchAsDataUri(url) {
    if (fontDataUriCache.has(url)) return fontDataUriCache.get(url);
    let dataUri = null;
    try {
      const response = await fetch(url, { mode: "cors", credentials: "omit" });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size <= MAX_FONT_BYTES) {
          dataUri = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();


</script></body>
</html>
